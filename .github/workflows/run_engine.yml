name: Run B3 Investment Engine

on:
  schedule:
    - cron: "30 22 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-engine:

    name: B3 Investment Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. INFORMAÇÕES DO AMBIENTE
      # ======================================================

      - name: Environment information
        run: |
          echo "=========================================="
          echo "B3_INVESTMENT_ENGINE"
          echo "=========================================="
          python --version
          pip --version
          echo "UTC:"
          date -u
          echo "=========================================="


      # ======================================================
      # 5. VALIDAR CONFIGURAÇÃO
      # ======================================================

      - name: Validate configuration
        run: |
          python config.py


      # ======================================================
      # 6. ATUALIZAR DADOS OFICIAIS CVM
      # ======================================================

      - name: Update official CVM data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO OFICIAL CVM"
          echo "=========================================="

          python update_cvm_data.py

          echo "=========================================="
          echo "DADOS CVM ATUALIZADOS"
          echo "=========================================="


      # ======================================================
      # 7. AUDITAR DADOS CVM ATUALIZADOS
      # ======================================================

      - name: Audit updated CVM data
        run: |
          echo "=========================================="
          echo "AUDITORIA DA CAMADA CVM"
          echo "=========================================="

          if [ ! -f "data/live/cvm/cad_cia_aberta.csv" ]; then
            echo "ERRO:"
            echo "Cadastro CVM atualizado não encontrado."
            exit 1
          fi

          if [ ! -f "data/live/cvm/cvm_manifest.json" ]; then
            echo "ERRO:"
            echo "Manifesto CVM não encontrado."
            exit 1
          fi

          echo "Cadastro CVM: OK"
          echo "Manifesto CVM: OK"

          echo ""
          echo "Arquivos DFP:"
          find data/live/cvm/dfp -maxdepth 1 -type f -print | sort

          echo ""
          echo "Arquivos ITR:"
          find data/live/cvm/itr -maxdepth 1 -type f -print | sort

          echo ""
          echo "Manifesto:"
          cat data/live/cvm/cvm_manifest.json

          echo ""
          echo "=========================================="
          echo "CAMADA CVM VALIDADA"
          echo "=========================================="


      # ======================================================
      # 8. TESTAR FUNDAMENTAL ENGINE
      # ======================================================

      - name: Test Fundamental Engine
        run: |
          python fundamental_engine.py


      # ======================================================
      # 9. TESTAR TECHNICAL TIMING ENGINE
      # ======================================================

      - name: Test Technical Timing Engine
        run: |
          python technical_engine.py


      # ======================================================
      # 10. TESTAR INTEGRATION ENGINE
      # ======================================================

      - name: Test Integration Engine
        run: |
          python integration_engine.py


      # ======================================================
      # 11. VERIFICAR DADOS DE ENTRADA
      # ======================================================

      - name: Check input data
        run: |
          echo "Verificando arquivos de entrada..."

          if [ ! -f "data/fundamental_input.csv" ]; then
            echo "ERRO:"
            echo "data/fundamental_input.csv não encontrado."
            exit 1
          fi

          if [ ! -f "data/technical_prices.csv" ]; then
            echo "ERRO:"
            echo "data/technical_prices.csv não encontrado."
            exit 1
          fi

          echo "Arquivos de entrada encontrados."

          ls -lh data/


      # ======================================================
      # 12. EXECUTAR O MOTOR
      # ======================================================

      - name: Run B3 Investment Engine
        run: |
          python main.py


      # ======================================================
      # 13. GERAR RELATÓRIO FINAL
      # ======================================================

      - name: Generate final report
        run: |
          python report_generator.py


      # ======================================================
      # 14. MOSTRAR ARQUIVOS GERADOS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ -d "data/live/cvm" ]; then
            echo ""
            echo "CVM:"
            find data/live/cvm -maxdepth 2 -type f -print
          fi

          if [ -d "final_report" ]; then
            echo ""
            echo "FINAL REPORT:"
            find final_report -maxdepth 2 -type f -print
          fi

          if [ -d "checkpoints" ]; then
            echo ""
            echo "CHECKPOINTS:"
            find checkpoints -maxdepth 2 -type f -print
          fi

          if [ -d "logs" ]; then
            echo ""
            echo "LOGS:"
            find logs -maxdepth 2 -type f -print
          fi


      # ======================================================
      # 15. SALVAR RELATÓRIO COMO ARTIFACT
      # ======================================================

      - name: Upload final report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_REPORT
          path: |
            final_report/
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 16. SALVAR MANIFESTO CVM
      # ======================================================

      - name: Upload CVM manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_CVM_MANIFEST
          path: |
            data/live/cvm/cvm_manifest.json
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 17. SALVAR CHECKPOINTS
      # ======================================================

      - name: Upload checkpoints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_CHECKPOINTS
          path: |
            checkpoints/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 18. SALVAR LOGS SE HOUVER FALHA
      # ======================================================

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_FAILURE_LOGS
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 30
