name: Run B3 Investment Engine

on:
  schedule:
    - cron: "30 22 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

# ============================================================
# EVITA DUAS EXECUÇÕES DO ROBÔ AO MESMO TEMPO
# ============================================================
#
# Uma execução nova fica aguardando a anterior terminar.
# Não cancela uma execução que já esteja trabalhando.
#
# ============================================================

concurrency:
  group: b3-investment-engine
  cancel-in-progress: false


jobs:

  run-engine:

    name: B3 Investment Engine

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. DEPENDÊNCIAS
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. DATA DE EXECUÇÃO
      # ======================================================
      #
      # O ano é calculado dinamicamente.
      #
      # Isso evita deixar "2026" fixo no cache COTAHIST.
      #
      # Em 2027, 2028, 2029 etc. o workflow continua
      # funcionando sem alteração manual.
      #
      # ======================================================

      - name: Runtime information
        id: runtime
        shell: bash
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "RUNTIME"
          echo "=========================================="
          echo "Ano UTC: $(date -u +%Y)"
          echo "Data UTC: $(date -u +%Y-%m-%d)"
          echo "=========================================="


      # ======================================================
      # 5. AMBIENTE
      # ======================================================

      - name: Environment information
        run: |
          echo "=========================================="
          echo "B3_INVESTMENT_ENGINE"
          echo "=========================================="

          python --version
          pip --version

          echo ""
          echo "UTC:"
          date -u

          echo "=========================================="


      # ======================================================
      # 6. CONFIGURAÇÃO
      # ======================================================

      - name: Validate configuration
        run: |
          python config.py


      # ======================================================
      # 7. MOTORES CONGELADOS
      # ======================================================
      #
      # NÃO altera metodologia.
      #
      # ======================================================

      - name: Test Fundamental Engine
        run: |
          python fundamental_engine.py

      - name: Test Technical Timing Engine
        run: |
          python technical_engine.py

      - name: Test Integration Engine
        run: |
          python integration_engine.py


      # ======================================================
      # 8. RESTAURAR CACHE CVM
      # ======================================================

      - name: Restore CVM LIVE cache
        id: restore-cvm
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/cvm

          key: cvm-live-v3-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            cvm-live-v3-${{ runner.os }}-


      # ======================================================
      # 9. RESTAURAR COTAHIST
      # ======================================================

      - name: Restore B3 COTAHIST cache
        id: restore-cotahist
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/cotahist

          key: b3-cotahist-${{ runner.os }}-${{ steps.runtime.outputs.year }}

          restore-keys: |
            b3-cotahist-${{ runner.os }}-


      # ======================================================
      # 10. RESTAURAR SPRE + CURSOR
      # ======================================================

      - name: Restore B3 current-year SPRE cache
        id: restore-spre
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/current_year

          key: b3-spre-v3-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            b3-spre-v3-${{ runner.os }}-


      # ======================================================
      # 11. RESTAURAR MARKET HISTORY V6
      # ======================================================

      - name: Restore B3 V6 market-history cache
        id: restore-v6
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/cache/market_history_v6

          key: b3-market-v6-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            b3-market-v6-${{ runner.os }}-


      # ======================================================
      # 12. AUDITAR CACHES RESTAURADOS
      # ======================================================

      - name: Audit restored B3 caches
        run: |
          echo "=========================================="
          echo "CACHE B3 RESTAURADO"
          echo "=========================================="

          echo ""
          echo "COTAHIST:"

          if [ -d "data/live/b3/cotahist" ]; then

            COUNT=$(find data/live/b3/cotahist \
              -maxdepth 1 \
              -type f \
              \( -name 'COTAHIST_A*.ZIP' -o -name 'COTAHIST_A*.zip' \) \
              | wc -l)

            echo "Arquivos COTAHIST: $COUNT"

          else

            echo "Nenhum COTAHIST restaurado."

          fi

          echo ""
          echo "SPRE:"

          if [ -d "data/live/b3/current_year" ]; then

            COUNT=$(find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              \( -name 'SPRE*.zip' -o -name 'SPRE*.ZIP' \) \
              | wc -l)

            echo "Arquivos SPRE: $COUNT"

            if [ -f "data/live/b3/current_year/.bootstrap_state.json" ]; then

              echo ""
              echo "Bootstrap state:"
              cat data/live/b3/current_year/.bootstrap_state.json

            else

              echo "Bootstrap state: AUSENTE"

            fi

          else

            echo "Nenhum SPRE restaurado."

          fi

          echo ""
          echo "MARKET HISTORY V6:"

          if [ -d "data/live/b3/cache/market_history_v6" ]; then

            echo "Cache V6 encontrado."

            if [ -f "data/live/b3/cache/market_history_v6/state.json" ]; then

              echo ""
              echo "State V6:"
              cat data/live/b3/cache/market_history_v6/state.json

            else

              echo "state.json: AUSENTE"

            fi

            if [ -f "data/live/b3/cache/market_history_v6/build_status.json" ]; then

              echo ""
              echo "Build status V6:"
              cat data/live/b3/cache/market_history_v6/build_status.json

            else

              echo "build_status.json: AUSENTE"

            fi

          else

            echo "Nenhum cache V6 restaurado."

          fi

          echo ""
          echo "CACHE HIT COTAHIST:"
          echo "${{ steps.restore-cotahist.outputs.cache-hit }}"

          echo ""
          echo "CACHE HIT SPRE:"
          echo "${{ steps.restore-spre.outputs.cache-hit }}"

          echo ""
          echo "CACHE HIT MARKET V6:"
          echo "${{ steps.restore-v6.outputs.cache-hit }}"

          echo "=========================================="


      # ======================================================
      # 13. CVM LIVE
      # ======================================================

      - name: Update official CVM data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO OFICIAL CVM"
          echo "=========================================="

          python update_cvm_data.py

          echo "=========================================="
          echo "DADOS CVM ATUALIZADOS"
          echo "=========================================="


      # ======================================================
      # 14. AUDITAR CVM
      # ======================================================

      - name: Audit updated CVM data
        run: |
          echo "=========================================="
          echo "AUDITORIA DA CAMADA CVM"
          echo "=========================================="

          if [ ! -f "data/live/cvm/cad_cia_aberta.csv" ]; then
            echo "ERRO: cadastro CVM não encontrado."
            exit 1
          fi

          if [ ! -f "data/live/cvm/cvm_manifest.json" ]; then
            echo "ERRO: manifesto CVM não encontrado."
            exit 1
          fi

          echo "Cadastro CVM: OK"
          echo "Manifesto CVM: OK"


      # ======================================================
      # 15. SALVAR CACHE CVM
      # ======================================================

      - name: Save CVM LIVE cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/cvm

          key: cvm-live-v3-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 16. HISTÓRICO B3
      # ======================================================

      - name: Update official B3 historical data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO HISTÓRICA B3"
          echo "=========================================="

          python update_b3_data.py

          echo "=========================================="
          echo "HISTÓRICO B3 ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 17. SALVAR COTAHIST
      # ======================================================

      - name: Save B3 COTAHIST cache
        if: >
          success() &&
          steps.restore-cotahist.outputs.cache-hit != 'true'

        uses: actions/cache/save@v4

        with:
          path: |
            data/live/b3/cotahist

          key: b3-cotahist-${{ runner.os }}-${{ steps.runtime.outputs.year }}


      # ======================================================
      # 18. B3 ANO CORRENTE — LOTE 1
      # ======================================================

      - name: Update current-year B3 batch 1
        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 1"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 19. VERIFICAR BOOTSTRAP — LOTE 1
      # ======================================================

      - name: Check B3 bootstrap batch 1
        id: batch1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          complete = False

          if p.exists():
              data = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              complete = bool(
                  data.get(
                      "complete",
                      False,
                  )
              )

          print(
              "Bootstrap completo:",
              complete,
          )

          Path(
              "/tmp/b3_batch1.txt"
          ).write_text(
              "true"
              if complete
              else "false",
              encoding="utf-8",
          )
          PY

          COMPLETE=$(cat /tmp/b3_batch1.txt)
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 20. B3 ANO CORRENTE — LOTE 2
      # ======================================================

      - name: Update current-year B3 batch 2
        if: steps.batch1.outputs.complete != 'true'
        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 2"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 21. VERIFICAR BOOTSTRAP — LOTE 2
      # ======================================================

      - name: Check B3 bootstrap batch 2
        id: batch2
        if: steps.batch1.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          complete = False

          if p.exists():
              data = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              complete = bool(
                  data.get(
                      "complete",
                      False,
                  )
              )

          print(
              "Bootstrap completo:",
              complete,
          )

          Path(
              "/tmp/b3_batch2.txt"
          ).write_text(
              "true"
              if complete
              else "false",
              encoding="utf-8",
          )
          PY

          COMPLETE=$(cat /tmp/b3_batch2.txt)
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 22. B3 ANO CORRENTE — LOTE 3
      # ======================================================

      - name: Update current-year B3 batch 3
        if: >
          steps.batch1.outputs.complete != 'true' &&
          steps.batch2.outputs.complete != 'true'

        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 3"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 23. VERIFICAR BOOTSTRAP FINAL
      # ======================================================

      - name: Check B3 bootstrap final status
        id: bootstrap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          complete = False
          last_checked = None

          if p.exists():

              data = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              complete = bool(
                  data.get(
                      "complete",
                      False,
                  )
              )

              last_checked = data.get(
                  "last_checked_date"
              )

          print(
              "Bootstrap completo:",
              complete,
          )

          print(
              "Última data verificada:",
              last_checked,
          )

          Path(
              "/tmp/b3_bootstrap.txt"
          ).write_text(
              "true"
              if complete
              else "false",
              encoding="utf-8",
          )
          PY

          COMPLETE=$(cat /tmp/b3_bootstrap.txt)

          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "BOOTSTRAP COMPLETE = $COMPLETE"


      # ======================================================
      # 24. SALVAR SPRE + CURSOR
      # ======================================================

      - name: Save B3 current-year SPRE cache
        if: success()

        uses: actions/cache/save@v4

        with:
          path: |
            data/live/b3/current_year

          key: b3-spre-v3-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 25. INFORMAÇÃO DO BOOTSTRAP
      # ======================================================

      - name: Bootstrap progress information
        if: steps.bootstrap.outputs.complete != 'true'
        run: |
          echo "=========================================="
          echo "BOOTSTRAP B3 AINDA EM ANDAMENTO"
          echo "=========================================="

          echo ""
          echo "Os lotes desta execução foram concluídos."
          echo "SPRE e cursor foram salvos."
          echo ""
          echo "A próxima execução continuará do ponto salvo."
          echo ""
          echo "Market History V6 não será iniciado"
          echo "enquanto o bootstrap SPRE não terminar."
          echo ""
          echo "=========================================="


      # ======================================================
      # 26. BUILD MARKET HISTORY V6 — UM LOTE
      # ======================================================

      - name: Build B3 market history LIVE V6
        id: market-build
        if: steps.bootstrap.outputs.complete == 'true'

        env:
          B3_MARKET_HISTORY_SPRE_BATCH_SIZE: "25"

        run: |
          echo "=========================================="
          echo "BUILD B3 MARKET HISTORY LIVE — V6"
          echo "=========================================="

          python -u build_b3_market_history.py

          STATUS_FILE="data/live/b3/cache/market_history_v6/build_status.json"

          if [ ! -f "$STATUS_FILE" ]; then
            echo "ERRO:"
            echo "build_status.json V6 não foi criado."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/live/b3/cache/"
              "market_history_v6/"
              "build_status.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          complete = bool(
              data.get(
                  "complete",
                  False,
              )
          )

          phase = data.get(
              "phase"
          )

          total = int(
              data.get(
                  "spre_total",
                  0,
              )
          )

          ready = int(
              data.get(
                  "spre_ready",
                  0,
              )
          )

          pending = int(
              data.get(
                  "spre_pending",
                  0,
              )
          )

          processed = int(
              data.get(
                  "spre_processed_now",
                  0,
              )
          )

          print()
          print(
              "=========================================="
          )

          print(
              "STATUS MARKET HISTORY V6"
          )

          print(
              "=========================================="
          )

          print(
              "Phase:",
              phase,
          )

          print(
              "SPRE total:",
              total,
          )

          print(
              "SPRE prontos:",
              ready,
          )

          print(
              "SPRE pendentes:",
              pending,
          )

          print(
              "Processados nesta execução:",
              processed,
          )

          print(
              "BUILD COMPLETE =",
              complete,
          )

          print(
              "=========================================="
          )

          Path(
              "/tmp/b3_market_v6_complete.txt"
          ).write_text(
              "true"
              if complete
              else "false",
              encoding="utf-8",
          )
          PY

          COMPLETE=$(cat /tmp/b3_market_v6_complete.txt)
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 27. SALVAR CACHE MARKET HISTORY V6
      # ======================================================

      - name: Save B3 V6 market-history cache
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true'

        uses: actions/cache/save@v4

        with:
          path: |
            data/live/b3/cache/market_history_v6

          key: b3-market-v6-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 28. MARKET HISTORY V6 AINDA EM CONSTRUÇÃO
      # ======================================================

      - name: Market History V6 progress information
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete != 'true'

        run: |
          echo "=========================================="
          echo "MARKET HISTORY V6 — LOTE CONCLUÍDO"
          echo "=========================================="

          echo ""
          echo "As partições processadas foram salvas."
          echo ""
          echo "A próxima execução restaurará o cache V6"
          echo "e continuará somente os SPRE pendentes."
          echo ""
          echo "Fundamentos e motor NÃO serão executados"
          echo "até BUILD COMPLETE = true."
          echo ""
          echo "=========================================="


      # ======================================================
      # 29. VALIDAR MARKET HISTORY FINAL
      # ======================================================

      - name: Validate completed B3 market history
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          echo "=========================================="
          echo "VALIDAÇÃO MARKET HISTORY FINAL"
          echo "=========================================="

          if [ ! -f "data/live/b3/market_history_live.csv" ]; then
            echo "ERRO:"
            echo "market_history_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/spre_prices_live.csv" ]; then
            echo "ERRO:"
            echo "spre_prices_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/market_history_manifest.json" ]; then
            echo "ERRO:"
            echo "market_history_manifest.json não foi criado."
            exit 1
          fi

          echo ""
          echo "market_history_live.csv: OK"
          echo "spre_prices_live.csv: OK"
          echo "market_history_manifest.json: OK"

          echo ""
          echo "MARKET HISTORY V6: COMPLETO"


      # ======================================================
      # 30. FUNDAMENTAL LIVE
      # ======================================================

      - name: Build LIVE fundamental input
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          echo "=========================================="
          echo "BUILD FUNDAMENTAL INPUT LIVE"
          echo "=========================================="

          python build_live_fundamental_input.py

          echo "=========================================="
          echo "FUNDAMENTOS LIVE CONSTRUÍDOS"
          echo "=========================================="


      # ======================================================
      # 31. AUDITAR FUNDAMENTAL LIVE
      # ======================================================

      - name: Audit LIVE fundamental input
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          FILE="data/live/fundamental/fundamental_input_live.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO: fundamental_input_live.csv não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/live/fundamental/"
              "fundamental_input_live.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "TICKER",
              "QUALITY_SCORE",
              "HISTORY_YEARS",
              "AVG_DAILY_LIQUIDITY_BRL",
              "VALUATION_SCORE",
              "FUNDAMENTAL_SCORE",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"ERRO: colunas ausentes: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: fundamental LIVE vazio."
              )

          tickers = (
              df["TICKER"]
              .astype(str)
              .str.strip()
              .str.upper()
          )

          if tickers.duplicated().any():
              raise SystemExit(
                  "ERRO: tickers duplicados."
              )

          print(
              "Empresas:",
              len(df),
          )

          print(
              "Tickers únicos:",
              tickers.nunique(),
          )

          print(
              "Fundamental LIVE: OK"
          )
          PY


      # ======================================================
      # 32. CONSTRUIR BASE TÉCNICA LIVE
      # ======================================================
      #
      # Usa dados B3 atuais.
      #
      # Preserva Cell05B + Cell06B.
      #
      # Recalcula somente os 7 indicadores técnicos
      # congelados pela pesquisa original.
      #
      # NÃO cria Technical Score.
      # NÃO altera ranking fundamental.
      #
      # ======================================================

      - name: Build LIVE technical input
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          echo "=========================================="
          echo "BUILD TECHNICAL INPUT LIVE"
          echo "=========================================="

          python -u build_technical_prices.py

          echo "=========================================="
          echo "TÉCNICO LIVE CONSTRUÍDO"
          echo "=========================================="


      # ======================================================
      # 33. VALIDAR BASE TÉCNICA LIVE
      # ======================================================

      - name: Validate LIVE technical input
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          FILE="data/live/technical/technical_prices_live.csv"
          MANIFEST="data/live/technical/technical_prices_live_manifest.json"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO:"
            echo "$MANIFEST não encontrado."
            exit 1
          fi

          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/live/technical/"
              "technical_prices_live.csv"
          )

          manifest_path = Path(
              "data/live/technical/"
              "technical_prices_live_manifest.json"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "CD_CVM",
              "TICKER",
              "DATE",
              "TECH_SEGMENT_ID",
              "OPEN",
              "HIGH",
              "LOW",
              "CLOSE",
              "SMA200_SLOPE_20D",
              "ATR_PCT",
              "ROC_60",
              "MACD_HIST_PCT",
              "DIST_SMA_200",
              "BB_WIDTH",
              "DIST_SMA_50",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"ERRO: colunas técnicas ausentes: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: technical_prices_live.csv vazio."
              )

          forbidden = [
              "TECHNICAL_SCORE",
              "BUY_SIGNAL",
              "SELL_SIGNAL",
              "MANDATORY_TRIGGER",
              "VALIDATED_OOS_TRIGGER",
          ]

          violations = [
              c
              for c in forbidden
              if c in df.columns
          ]

          if violations:
              raise SystemExit(
                  "ERRO: arquitetura técnica violada: "
                  f"{violations}"
              )

          dates = pd.to_datetime(
              df["DATE"],
              errors="coerce",
          )

          latest_date = dates.max()

          if pd.isna(latest_date):
              raise SystemExit(
                  "ERRO: nenhuma data técnica válida."
              )

          latest_rows = (
              df.assign(_DATE=dates)
              .sort_values("_DATE")
              .groupby(
                  "TICKER",
                  as_index=False,
              )
              .tail(1)
          )

          indicators = [
              "SMA200_SLOPE_20D",
              "ATR_PCT",
              "ROC_60",
              "MACD_HIST_PCT",
              "DIST_SMA_200",
              "BB_WIDTH",
              "DIST_SMA_50",
          ]

          complete_context = (
              latest_rows[indicators]
              .notna()
              .all(axis=1)
              .sum()
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if manifest.get("data_mode") != "LIVE":
              raise SystemExit(
                  "ERRO: manifesto técnico não está LIVE."
              )

          if manifest.get("methodology_mode") != "FROZEN":
              raise SystemExit(
                  "ERRO: metodologia técnica não está FROZEN."
              )

          if manifest.get("technical_score_created") is not False:
              raise SystemExit(
                  "ERRO: Technical Score indevido."
              )

          if manifest.get("ranking_modified") is not False:
              raise SystemExit(
                  "ERRO: ranking fundamental foi alterado."
              )

          print(
              "Registros técnicos:",
              len(df),
          )

          print(
              "Tickers:",
              df["TICKER"].nunique(),
          )

          print(
              "Último pregão:",
              latest_date.date(),
          )

          print(
              "Contextos técnicos completos no último registro:",
              int(complete_context),
          )

          print(
              "Technical Score: NÃO"
          )

          print(
              "Dados técnicos: LIVE"
          )

          print(
              "Metodologia técnica: CONGELADA"
          )

          print(
              "Base técnica LIVE: OK"
          )
          PY


      # ======================================================
      # 34. EXECUTAR MOTOR
      # ======================================================

      - name: Run B3 Investment Engine
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          echo "=========================================="
          echo "EXECUTANDO B3 INVESTMENT ENGINE"
          echo "=========================================="

          python main.py


      # ======================================================
      # 35. VALIDAR RESULTADO
      # ======================================================

      - name: Validate engine results
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          if [ ! -f "final_report/b3_investment_engine_results.csv" ]; then
            echo "ERRO: resultado completo não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/b3_investment_engine_eligible.csv" ]; then
            echo "ERRO: elegíveis não encontrados."
            exit 1
          fi

          if [ ! -f "final_report/run_summary.json" ]; then
            echo "ERRO: run_summary.json não encontrado."
            exit 1
          fi

          echo "Resultado do motor: OK"


      # ======================================================
      # 36. RELATÓRIO FINAL
      # ======================================================

      - name: Generate final report
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          python report_generator.py


      # ======================================================
      # 37. MOSTRAR RESULTADO NO LOG
      # ======================================================

      - name: Show selected stocks
        if: >
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "final_report/"
              "b3_investment_engine_eligible.csv"
          )

          if not path.exists():
              raise SystemExit(
                  "Arquivo de elegíveis não encontrado."
              )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          print()
          print(
              "=" * 72
          )

          print(
              "AÇÕES SELECIONADAS — "
              "B3 INVESTMENT ENGINE"
          )

          print(
              "=" * 72
          )

          preferred = [
              "TICKER",
              "QUALITY_SCORE",
              "VALUATION_SCORE",
              "FUNDAMENTAL_SCORE",
              "HISTORY_YEARS",
              "AVG_DAILY_LIQUIDITY_BRL",
          ]

          columns = [
              c
              for c in preferred
              if c in df.columns
          ]

          if "FUNDAMENTAL_SCORE" in df.columns:

              df = df.sort_values(
                  "FUNDAMENTAL_SCORE",
                  ascending=False,
              )

          if columns:

              print(
                  df[columns]
                  .to_string(
                      index=False
                  )
              )

          else:

              print(
                  df.to_string(
                      index=False
                  )
              )

          print(
              "=" * 72
          )
          PY


      # ======================================================
      # 38. ARQUIVOS GERADOS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ -d "data/live/b3/current_year" ]; then

            echo ""
            echo "SPRE:"

            find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              -print \
              | sort \
              | tail -20

          fi

          if [ -f "data/live/b3/current_year/.bootstrap_state.json" ]; then

            echo ""
            echo "BOOTSTRAP STATE:"

            cat data/live/b3/current_year/.bootstrap_state.json

          fi

          if [ -f "data/live/b3/cache/market_history_v6/build_status.json" ]; then

            echo ""
            echo "MARKET HISTORY V6 STATUS:"

            cat data/live/b3/cache/market_history_v6/build_status.json

          fi

          if [ -d "data/live/technical" ]; then

            echo ""
            echo "TECHNICAL LIVE:"

            find data/live/technical \
              -maxdepth 1 \
              -type f \
              -print \
              | sort

          fi

          if [ -d "final_report" ]; then

            echo ""
            echo "FINAL REPORT:"

            find final_report \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

          fi


      # ======================================================
      # 39. UPLOAD RELATÓRIO FINAL
      # ======================================================

      - name: Upload final report
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: B3_INVESTMENT_ENGINE_REPORT

          path: |
            final_report/

          if-no-files-found: error

          retention-days: 30


      # ======================================================
      # 40. UPLOAD MANIFESTOS LIVE
      # ======================================================

      - name: Upload LIVE manifests
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: B3_INVESTMENT_ENGINE_LIVE_MANIFESTS

          path: |
            data/live/cvm/cvm_manifest.json
            data/live/b3/*.json
            data/live/b3/current_year/.bootstrap_state.json
            data/live/b3/cache/market_history_v6/build_status.json
            data/live/technical/technical_prices_live_manifest.json

          if-no-files-found: warn

          retention-days: 30


      # ======================================================
      # 41. UPLOAD BASE TÉCNICA LIVE
      # ======================================================

      - name: Upload LIVE technical audit
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: B3_INVESTMENT_ENGINE_TECHNICAL_LIVE

          path: |
            data/live/technical/technical_prices_live.csv
            data/live/technical/technical_prices_live_manifest.json
            data/live/technical/technical_corporate_actions_live.csv
            data/live/technical/technical_residual_discontinuities_live.csv

          if-no-files-found: error

          retention-days: 30


      # ======================================================
      # 42. CHECKPOINTS
      # ======================================================

      - name: Upload checkpoints
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true' &&
          steps.market-build.outputs.complete == 'true'

        uses: actions/upload-artifact@v4

        with:
          name: B3_INVESTMENT_ENGINE_CHECKPOINTS

          path: |
            checkpoints/

          if-no-files-found: warn

          retention-days: 30


      # ======================================================
      # 43. LOGS EM FALHA
      # ======================================================

      - name: Upload logs on failure
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: B3_INVESTMENT_ENGINE_FAILURE_LOGS

          path: |
            logs/

          if-no-files-found: ignore

          retention-days: 30
