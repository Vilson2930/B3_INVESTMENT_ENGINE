name: Run B3 Investment Engine

on:
  schedule:
    - cron: "30 22 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-engine:

    name: B3 Investment Engine
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. DEPENDÊNCIAS
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. AMBIENTE
      # ======================================================

      - name: Environment information
        run: |
          echo "=========================================="
          echo "B3_INVESTMENT_ENGINE"
          echo "=========================================="
          python --version
          pip --version
          echo "UTC:"
          date -u
          echo "=========================================="


      # ======================================================
      # 5. CONFIGURAÇÃO
      # ======================================================

      - name: Validate configuration
        run: |
          python config.py


      # ======================================================
      # 6. MOTORES CONGELADOS
      # ======================================================

      - name: Test Fundamental Engine
        run: |
          python fundamental_engine.py

      - name: Test Technical Timing Engine
        run: |
          python technical_engine.py

      - name: Test Integration Engine
        run: |
          python integration_engine.py


      # ======================================================
      # 7. RESTAURAR COTAHIST
      # ======================================================

      - name: Restore B3 COTAHIST cache
        id: restore-cotahist
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/cotahist
          key: b3-cotahist-${{ runner.os }}-2026
          restore-keys: |
            b3-cotahist-${{ runner.os }}-


      # ======================================================
      # 8. RESTAURAR SPRE + CURSOR DO BOOTSTRAP
      # ======================================================

      - name: Restore B3 current-year SPRE cache
        id: restore-spre
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/current_year
          key: b3-spre-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            b3-spre-v3-${{ runner.os }}-


      # ======================================================
      # 9. RESTAURAR CACHE PROCESSADO V5
      # ======================================================

      - name: Restore B3 V5 processed cache
        id: restore-v5
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/cache/market_history_v5
          key: b3-v5-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            b3-v5-${{ runner.os }}-


      # ======================================================
      # 10. AUDITAR CACHE RESTAURADO
      # ======================================================

      - name: Audit restored B3 caches
        run: |
          echo "=========================================="
          echo "CACHE B3 RESTAURADO"
          echo "=========================================="

          echo ""
          echo "COTAHIST:"

          if [ -d "data/live/b3/cotahist" ]; then
            COUNT=$(find data/live/b3/cotahist \
              -maxdepth 1 \
              -type f \
              \( -name 'COTAHIST_A*.ZIP' -o -name 'COTAHIST_A*.zip' \) \
              | wc -l)

            echo "Arquivos COTAHIST: $COUNT"
          else
            echo "Nenhum COTAHIST restaurado."
          fi

          echo ""
          echo "SPRE:"

          if [ -d "data/live/b3/current_year" ]; then
            COUNT=$(find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              \( -name 'SPRE*.zip' -o -name 'SPRE*.ZIP' \) \
              | wc -l)

            echo "Arquivos SPRE: $COUNT"

            if [ -f "data/live/b3/current_year/.bootstrap_state.json" ]; then
              echo ""
              echo "Bootstrap state:"
              cat data/live/b3/current_year/.bootstrap_state.json
            else
              echo "Bootstrap state: AUSENTE"
            fi
          else
            echo "Nenhum SPRE restaurado."
          fi

          echo ""
          echo "Cache hit COTAHIST:"
          echo "${{ steps.restore-cotahist.outputs.cache-hit }}"

          echo "Cache hit SPRE:"
          echo "${{ steps.restore-spre.outputs.cache-hit }}"

          echo "Cache hit V5:"
          echo "${{ steps.restore-v5.outputs.cache-hit }}"

          echo "=========================================="


      # ======================================================
      # 11. CVM LIVE
      # ======================================================

      - name: Update official CVM data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO OFICIAL CVM"
          echo "=========================================="

          python update_cvm_data.py

          echo "=========================================="
          echo "DADOS CVM ATUALIZADOS"
          echo "=========================================="


      # ======================================================
      # 12. AUDITAR CVM
      # ======================================================

      - name: Audit updated CVM data
        run: |
          echo "=========================================="
          echo "AUDITORIA DA CAMADA CVM"
          echo "=========================================="

          if [ ! -f "data/live/cvm/cad_cia_aberta.csv" ]; then
            echo "ERRO: cadastro CVM não encontrado."
            exit 1
          fi

          if [ ! -f "data/live/cvm/cvm_manifest.json" ]; then
            echo "ERRO: manifesto CVM não encontrado."
            exit 1
          fi

          echo "Cadastro CVM: OK"
          echo "Manifesto CVM: OK"


      # ======================================================
      # 13. HISTÓRICO B3
      # ======================================================

      - name: Update official B3 historical data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO HISTÓRICA B3"
          echo "=========================================="

          python update_b3_data.py

          echo "=========================================="
          echo "HISTÓRICO B3 ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 14. SALVAR COTAHIST
      # ======================================================

      - name: Save B3 COTAHIST cache
        if: success() && steps.restore-cotahist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/cotahist
          key: b3-cotahist-${{ runner.os }}-2026


      # ======================================================
      # 15. B3 ANO CORRENTE — LOTE 1
      # ======================================================

      - name: Update current-year B3 batch 1
        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 1"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 16. VERIFICAR BOOTSTRAP APÓS LOTE 1
      # ======================================================

      - name: Check B3 bootstrap batch 1
        id: batch1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          if not p.exists():
              print("complete=false")

              with open(
                  "/tmp/b3_batch1.txt",
                  "w",
                  encoding="utf-8",
              ) as f:
                  f.write("false")

              raise SystemExit(0)

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          complete = bool(
              data.get(
                  "complete",
                  False,
              )
          )

          print(
              "Bootstrap completo:",
              complete,
          )

          with open(
              "/tmp/b3_batch1.txt",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(
                  "true"
                  if complete
                  else "false"
              )
          PY

          COMPLETE=$(cat /tmp/b3_batch1.txt)
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 17. B3 ANO CORRENTE — LOTE 2
      # ======================================================

      - name: Update current-year B3 batch 2
        if: steps.batch1.outputs.complete != 'true'
        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 2"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 18. VERIFICAR BOOTSTRAP APÓS LOTE 2
      # ======================================================

      - name: Check B3 bootstrap batch 2
        id: batch2
        if: steps.batch1.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          complete = False

          if p.exists():
              data = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              complete = bool(
                  data.get(
                      "complete",
                      False,
                  )
              )

          print(
              "Bootstrap completo:",
              complete,
          )

          with open(
              "/tmp/b3_batch2.txt",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(
                  "true"
                  if complete
                  else "false"
              )
          PY

          COMPLETE=$(cat /tmp/b3_batch2.txt)
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 19. B3 ANO CORRENTE — LOTE 3
      # ======================================================

      - name: Update current-year B3 batch 3
        if: >
          steps.batch1.outputs.complete != 'true' &&
          steps.batch2.outputs.complete != 'true'
        run: |
          echo "=========================================="
          echo "B3 ANO CORRENTE — LOTE 3"
          echo "=========================================="

          python -u update_b3_current_year.py


      # ======================================================
      # 20. VERIFICAR BOOTSTRAP APÓS LOTE 3
      # ======================================================

      - name: Check B3 bootstrap final status
        id: bootstrap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/live/b3/current_year/"
              ".bootstrap_state.json"
          )

          complete = False
          last_checked = None

          if p.exists():
              data = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              complete = bool(
                  data.get(
                      "complete",
                      False,
                  )
              )

              last_checked = data.get(
                  "last_checked_date"
              )

          print(
              "Bootstrap completo:",
              complete,
          )

          print(
              "Última data verificada:",
              last_checked,
          )

          with open(
              "/tmp/b3_bootstrap.txt",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(
                  "true"
                  if complete
                  else "false"
              )
          PY

          COMPLETE=$(cat /tmp/b3_bootstrap.txt)

          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "BOOTSTRAP COMPLETE = $COMPLETE"


      # ======================================================
      # 21. SALVAR SPRE + CURSOR
      # ======================================================
      #
      # IMPORTANTE:
      # salva mesmo quando bootstrap ainda não terminou.
      #
      # Assim a próxima execução continua de onde parou.
      # ======================================================

      - name: Save B3 current-year SPRE cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/current_year
          key: b3-spre-v3-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 22. ENCERRAR NORMALMENTE SE BOOTSTRAP AINDA ESTIVER
      #     EM ANDAMENTO
      # ======================================================

      - name: Bootstrap progress information
        if: steps.bootstrap.outputs.complete != 'true'
        run: |
          echo "=========================================="
          echo "BOOTSTRAP B3 AINDA EM ANDAMENTO"
          echo "=========================================="

          echo ""
          echo "Os lotes desta execução foram concluídos."
          echo "SPRE e cursor foram salvos no cache."
          echo ""
          echo "A próxima execução continuará do ponto salvo."
          echo ""
          echo "O build NÃO será executado enquanto o"
          echo "bootstrap não estiver completo."
          echo "=========================================="


      # ======================================================
      # 23. BUILD MARKET HISTORY V5
      # ======================================================

      - name: Build B3 market history LIVE
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          echo "=========================================="
          echo "BUILD B3 MARKET HISTORY LIVE — V5"
          echo "=========================================="

          python -u build_b3_market_history.py

          if [ ! -f "data/live/b3/market_history_live.csv" ]; then
            echo "ERRO:"
            echo "market_history_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/spre_prices_live.csv" ]; then
            echo "ERRO:"
            echo "spre_prices_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/market_history_manifest.json" ]; then
            echo "ERRO:"
            echo "market_history_manifest.json não foi criado."
            exit 1
          fi

          echo ""
          echo "market_history_live.csv: OK"
          echo "spre_prices_live.csv: OK"
          echo "market_history_manifest.json: OK"


      # ======================================================
      # 24. SALVAR CACHE V5
      # ======================================================

      - name: Save B3 V5 processed cache
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/cache/market_history_v5
          key: b3-v5-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 25. FUNDAMENTAL LIVE
      # ======================================================

      - name: Build LIVE fundamental input
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          echo "=========================================="
          echo "BUILD FUNDAMENTAL INPUT LIVE"
          echo "=========================================="

          python build_live_fundamental_input.py

          echo "=========================================="
          echo "FUNDAMENTOS LIVE CONSTRUÍDOS"
          echo "=========================================="


      # ======================================================
      # 26. AUDITAR FUNDAMENTAL
      # ======================================================

      - name: Audit LIVE fundamental input
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          FILE="data/live/fundamental/fundamental_input_live.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO: fundamental_input_live.csv não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/live/fundamental/"
              "fundamental_input_live.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "TICKER",
              "QUALITY_SCORE",
              "HISTORY_YEARS",
              "AVG_DAILY_LIQUIDITY_BRL",
              "VALUATION_SCORE",
              "FUNDAMENTAL_SCORE",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"ERRO: colunas ausentes: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: fundamental LIVE vazio."
              )

          tickers = (
              df["TICKER"]
              .astype(str)
              .str.strip()
              .str.upper()
          )

          if tickers.duplicated().any():
              raise SystemExit(
                  "ERRO: tickers duplicados."
              )

          print(
              "Empresas:",
              len(df),
          )

          print(
              "Tickers únicos:",
              tickers.nunique(),
          )

          print(
              "Fundamental LIVE: OK"
          )
          PY


      # ======================================================
      # 27. BASE TÉCNICA ATUAL
      # ======================================================
      #
      # TRANSITÓRIO.
      # Técnico LIVE ainda será substituído posteriormente.
      # ======================================================

      - name: Validate current technical input
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          FILE="data/technical_prices.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/technical_prices.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "CD_CVM",
              "TICKER",
              "DATE",
              "TECH_SEGMENT_ID",
              "OPEN",
              "HIGH",
              "LOW",
              "CLOSE",
              "SMA200_SLOPE_20D",
              "ATR_PCT",
              "ROC_60",
              "MACD_HIST_PCT",
              "DIST_SMA_200",
              "BB_WIDTH",
              "DIST_SMA_50",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"ERRO: colunas técnicas ausentes: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: technical_prices.csv vazio."
              )

          print(
              "Registros técnicos:",
              len(df),
          )

          print(
              "Tickers:",
              df["TICKER"].nunique(),
          )

          print(
              "Technical Score: NÃO"
          )

          print(
              "Base técnica atual: OK"
          )
          PY


      # ======================================================
      # 28. EXECUTAR MOTOR
      # ======================================================

      - name: Run B3 Investment Engine
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          echo "=========================================="
          echo "EXECUTANDO B3 INVESTMENT ENGINE"
          echo "=========================================="

          python main.py


      # ======================================================
      # 29. VALIDAR RESULTADO
      # ======================================================

      - name: Validate engine results
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          if [ ! -f "final_report/b3_investment_engine_results.csv" ]; then
            echo "ERRO: resultado completo não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/b3_investment_engine_eligible.csv" ]; then
            echo "ERRO: elegíveis não encontrados."
            exit 1
          fi

          if [ ! -f "final_report/run_summary.json" ]; then
            echo "ERRO: run_summary.json não encontrado."
            exit 1
          fi

          echo "Resultado do motor: OK"


      # ======================================================
      # 30. RELATÓRIO FINAL
      # ======================================================

      - name: Generate final report
        if: steps.bootstrap.outputs.complete == 'true'
        run: |
          python report_generator.py


      # ======================================================
      # 31. ARQUIVOS GERADOS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ -d "data/live/b3/current_year" ]; then
            echo ""
            echo "SPRE:"
            find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              -print \
              | sort \
              | tail -20
          fi

          if [ -f "data/live/b3/current_year/.bootstrap_state.json" ]; then
            echo ""
            echo "BOOTSTRAP STATE:"
            cat data/live/b3/current_year/.bootstrap_state.json
          fi

          if [ -d "final_report" ]; then
            echo ""
            echo "FINAL REPORT:"
            find final_report \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi


      # ======================================================
      # 32. UPLOAD RELATÓRIO
      # ======================================================

      - name: Upload final report
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_REPORT
          path: |
            final_report/
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 33. UPLOAD MANIFESTOS
      # ======================================================

      - name: Upload LIVE manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_LIVE_MANIFESTS
          path: |
            data/live/cvm/cvm_manifest.json
            data/live/b3/*.json
            data/live/b3/current_year/.bootstrap_state.json
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 34. CHECKPOINTS
      # ======================================================

      - name: Upload checkpoints
        if: >
          success() &&
          steps.bootstrap.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_CHECKPOINTS
          path: |
            checkpoints/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 35. LOGS EM FALHA
      # ======================================================

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_FAILURE_LOGS
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 30
