name: Run B3 Investment Engine

on:
  schedule:
    - cron: "30 22 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-engine:

    name: B3 Investment Engine
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. INFORMAÇÕES DO AMBIENTE
      # ======================================================

      - name: Environment information
        run: |
          echo "=========================================="
          echo "B3_INVESTMENT_ENGINE"
          echo "=========================================="
          python --version
          pip --version
          echo "UTC:"
          date -u
          echo "=========================================="


      # ======================================================
      # 5. VALIDAR CONFIGURAÇÃO
      # ======================================================

      - name: Validate configuration
        run: |
          python config.py


      # ======================================================
      # 6. TESTAR MOTORES CONGELADOS
      # ======================================================

      - name: Test Fundamental Engine
        run: |
          python fundamental_engine.py

      - name: Test Technical Timing Engine
        run: |
          python technical_engine.py

      - name: Test Integration Engine
        run: |
          python integration_engine.py


      # ======================================================
      # 7. RESTAURAR COTAHIST
      # ======================================================
      #
      # COTAHIST é histórico e praticamente imutável.
      # Mantemos separado do cache diário do SPRE/V5.
      # ======================================================

      - name: Restore B3 COTAHIST cache
        id: restore-cotahist
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/cotahist
          key: b3-cotahist-${{ runner.os }}-2026
          restore-keys: |
            b3-cotahist-${{ runner.os }}-


      # ======================================================
      # 8. RESTAURAR ANO CORRENTE + CACHE V5
      # ======================================================
      #
      # Restaura:
      # - arquivos SPRE já obtidos;
      # - partições COTAHIST processadas;
      # - partições SPRE processadas;
      # - state.json da V5.
      #
      # Cada execução recebe uma chave nova.
      # restore-keys recupera a versão anterior mais recente.
      # ======================================================

      - name: Restore B3 incremental cache
        id: restore-b3-live
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/b3/current_year
            data/live/b3/cache
          key: b3-incremental-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            b3-incremental-${{ runner.os }}-


      # ======================================================
      # 9. AUDITAR CACHE RESTAURADO
      # ======================================================

      - name: Audit restored B3 cache
        run: |
          echo "=========================================="
          echo "CACHE B3 RESTAURADO"
          echo "=========================================="

          echo ""
          echo "COTAHIST:"
          if [ -d "data/live/b3/cotahist" ]; then
            COUNT=$(find data/live/b3/cotahist \
              -maxdepth 1 \
              -type f \
              \( -name 'COTAHIST_A*.ZIP' -o -name 'COTAHIST_A*.zip' \) \
              | wc -l)

            echo "Arquivos COTAHIST: $COUNT"

            find data/live/b3/cotahist \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
          else
            echo "Nenhum COTAHIST restaurado."
          fi

          echo ""
          echo "SPRE:"
          if [ -d "data/live/b3/current_year" ]; then
            COUNT=$(find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              \( -name 'SPRE*.zip' -o -name 'SPRE*.ZIP' \) \
              | wc -l)

            echo "Arquivos SPRE: $COUNT"

            find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              \( -name 'SPRE*.zip' -o -name 'SPRE*.ZIP' \) \
              -print \
              | sort \
              | tail -10
          else
            echo "Nenhum SPRE restaurado."
          fi

          echo ""
          echo "CACHE V5:"
          if [ -d "data/live/b3/cache/market_history_v5" ]; then
            COTA_PARTS=$(find \
              data/live/b3/cache/market_history_v5/cotahist_parts \
              -maxdepth 1 \
              -type f \
              -name '*.csv' \
              2>/dev/null \
              | wc -l)

            SPRE_PARTS=$(find \
              data/live/b3/cache/market_history_v5/spre_parts \
              -maxdepth 1 \
              -type f \
              -name '*.csv' \
              2>/dev/null \
              | wc -l)

            echo "Partições COTAHIST V5: $COTA_PARTS"
            echo "Partições SPRE V5: $SPRE_PARTS"

            if [ -f "data/live/b3/cache/market_history_v5/state.json" ]; then
              echo "state.json V5: OK"
            else
              echo "state.json V5: ainda não criado."
            fi
          else
            echo "Cache V5 ainda não criado."
          fi

          echo "=========================================="


      # ======================================================
      # 10. ATUALIZAR DADOS OFICIAIS CVM
      # ======================================================

      - name: Update official CVM data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO OFICIAL CVM"
          echo "=========================================="

          python update_cvm_data.py

          echo "=========================================="
          echo "DADOS CVM ATUALIZADOS"
          echo "=========================================="


      # ======================================================
      # 11. AUDITAR CAMADA CVM
      # ======================================================

      - name: Audit updated CVM data
        run: |
          echo "=========================================="
          echo "AUDITORIA DA CAMADA CVM"
          echo "=========================================="

          if [ ! -f "data/live/cvm/cad_cia_aberta.csv" ]; then
            echo "ERRO:"
            echo "Cadastro CVM atualizado não encontrado."
            exit 1
          fi

          if [ ! -f "data/live/cvm/cvm_manifest.json" ]; then
            echo "ERRO:"
            echo "Manifesto CVM não encontrado."
            exit 1
          fi

          echo "Cadastro CVM: OK"
          echo "Manifesto CVM: OK"

          echo ""
          echo "Arquivos DFP:"
          find data/live/cvm/dfp \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo ""
          echo "Arquivos ITR:"
          find data/live/cvm/itr \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo ""
          echo "Manifesto:"
          cat data/live/cvm/cvm_manifest.json

          echo ""
          echo "=========================================="
          echo "CAMADA CVM VALIDADA"
          echo "=========================================="


      # ======================================================
      # 12. ATUALIZAR HISTÓRICO OFICIAL B3
      # ======================================================

      - name: Update official B3 historical data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO HISTÓRICA B3"
          echo "=========================================="

          python update_b3_data.py

          echo "=========================================="
          echo "HISTÓRICO B3 ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 13. SALVAR COTAHIST ANTES DO BUILD
      # ======================================================
      #
      # Este save ocorre ANTES da etapa pesada.
      #
      # Portanto, se qualquer etapa posterior falhar,
      # os arquivos históricos já baixados permanecem
      # disponíveis para a próxima execução.
      # ======================================================

      - name: Save B3 COTAHIST cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/cotahist
          key: b3-cotahist-${{ runner.os }}-2026


      # ======================================================
      # 14. ATUALIZAR ANO CORRENTE B3
      # ======================================================

      - name: Update current-year B3 data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO B3 — ANO CORRENTE"
          echo "=========================================="

          python update_b3_current_year.py

          echo "=========================================="
          echo "B3 ANO CORRENTE ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 15. SALVAR FONTES DO ANO CORRENTE ANTES DO BUILD
      # ======================================================
      #
      # Ponto crítico.
      #
      # Os SPRE baixados são persistidos ANTES do
      # build_b3_market_history.py.
      #
      # Mesmo que o build falhe, não será necessário
      # baixar novamente todo o ano.
      # ======================================================

      - name: Save B3 current-year source cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/current_year
          key: b3-spre-source-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 16. CONSTRUIR MARKET HISTORY LIVE — V5
      # ======================================================

      - name: Build B3 market history LIVE
        run: |
          echo "=========================================="
          echo "BUILD B3 MARKET HISTORY LIVE — V5"
          echo "=========================================="

          python -u build_b3_market_history.py

          if [ ! -f "data/live/b3/market_history_live.csv" ]; then
            echo "ERRO:"
            echo "market_history_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/spre_prices_live.csv" ]; then
            echo "ERRO:"
            echo "spre_prices_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/market_history_manifest.json" ]; then
            echo "ERRO:"
            echo "market_history_manifest.json não foi criado."
            exit 1
          fi

          echo ""
          echo "market_history_live.csv: OK"
          echo "spre_prices_live.csv: OK"
          echo "market_history_manifest.json: OK"

          echo ""
          echo "Manifesto:"
          cat data/live/b3/market_history_manifest.json


      # ======================================================
      # 17. SALVAR CACHE V5 IMEDIATAMENTE
      # ======================================================
      #
      # Só chegamos aqui quando o build V5 terminou.
      #
      # As partições e state.json são então persistidos
      # imediatamente, sem esperar o restante do robô.
      # ======================================================

      - name: Save B3 V5 processed cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/b3/cache
          key: b3-processed-${{ runner.os }}-${{ github.run_id }}


      # ======================================================
      # 18. CONSTRUIR FUNDAMENTOS LIVE
      # ======================================================

      - name: Build LIVE fundamental input
        run: |
          echo "=========================================="
          echo "BUILD FUNDAMENTAL INPUT LIVE"
          echo "=========================================="

          python build_live_fundamental_input.py

          echo "=========================================="
          echo "FUNDAMENTOS LIVE CONSTRUÍDOS"
          echo "=========================================="


      # ======================================================
      # 19. AUDITAR FUNDAMENTOS LIVE
      # ======================================================

      - name: Audit LIVE fundamental input
        run: |
          echo "=========================================="
          echo "AUDITORIA FUNDAMENTAL LIVE"
          echo "=========================================="

          FILE="data/live/fundamental/fundamental_input_live.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/live/fundamental/"
              "fundamental_input_live.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "TICKER",
              "QUALITY_SCORE",
              "HISTORY_YEARS",
              "AVG_DAILY_LIQUIDITY_BRL",
              "VALUATION_SCORE",
              "FUNDAMENTAL_SCORE",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "ERRO: colunas ausentes no "
                  f"fundamental LIVE: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: fundamental_input_live.csv vazio."
              )

          tickers = (
              df["TICKER"]
              .astype(str)
              .str.strip()
              .str.upper()
          )

          if tickers.duplicated().any():
              raise SystemExit(
                  "ERRO: tickers duplicados no "
                  "fundamental_input_live.csv."
              )

          quality = pd.to_numeric(
              df["QUALITY_SCORE"],
              errors="coerce",
          )

          print(
              "Empresas:",
              len(df),
          )

          print(
              "Tickers únicos:",
              tickers.nunique(),
          )

          print(
              "Quality Score >= 60:",
              int(
                  (quality >= 60).sum()
              ),
          )

          print(
              "Fundamental LIVE: OK"
          )
          PY


      # ======================================================
      # 20. VALIDAR BASE TÉCNICA ATUAL
      # ======================================================
      #
      # TRANSITÓRIO:
      #
      # Fundamental = LIVE
      # Técnico = data/technical_prices.csv
      #
      # Não declarar robô 100% LIVE até fecharmos
      # a camada técnica.
      # ======================================================

      - name: Validate current technical input
        run: |
          echo "=========================================="
          echo "AUDITORIA TÉCNICA ATUAL"
          echo "=========================================="

          FILE="data/technical_prices.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/technical_prices.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "CD_CVM",
              "TICKER",
              "DATE",
              "TECH_SEGMENT_ID",
              "OPEN",
              "HIGH",
              "LOW",
              "CLOSE",
              "SMA200_SLOPE_20D",
              "ATR_PCT",
              "ROC_60",
              "MACD_HIST_PCT",
              "DIST_SMA_200",
              "BB_WIDTH",
              "DIST_SMA_50",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "ERRO: colunas técnicas ausentes: "
                  f"{missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: technical_prices.csv vazio."
              )

          print(
              "Registros técnicos:",
              len(df),
          )

          print(
              "Tickers:",
              df["TICKER"].nunique(),
          )

          print(
              "Technical Score: NÃO"
          )

          print(
              "Base técnica atual: OK"
          )
          PY


      # ======================================================
      # 21. VERIFICAR ENTRADAS DO MAIN
      # ======================================================

      - name: Check engine input data
        run: |
          echo "=========================================="
          echo "ENTRADAS DO MAIN.PY"
          echo "=========================================="

          FUNDAMENTAL="data/live/fundamental/fundamental_input_live.csv"
          TECHNICAL="data/technical_prices.csv"

          if [ ! -f "$FUNDAMENTAL" ]; then
            echo "ERRO:"
            echo "$FUNDAMENTAL não encontrado."
            exit 1
          fi

          if [ ! -f "$TECHNICAL" ]; then
            echo "ERRO:"
            echo "$TECHNICAL não encontrado."
            exit 1
          fi

          echo "Fundamental LIVE: OK"
          echo "Técnico atual: OK"

          echo ""
          ls -lh "$FUNDAMENTAL"
          ls -lh "$TECHNICAL"


      # ======================================================
      # 22. EXECUTAR MOTOR
      # ======================================================

      - name: Run B3 Investment Engine
        run: |
          echo "=========================================="
          echo "EXECUTANDO B3 INVESTMENT ENGINE"
          echo "=========================================="

          python main.py


      # ======================================================
      # 23. VALIDAR RESULTADO
      # ======================================================

      - name: Validate engine results
        run: |
          echo "=========================================="
          echo "VALIDAÇÃO DO RESULTADO"
          echo "=========================================="

          if [ ! -f "final_report/b3_investment_engine_results.csv" ]; then
            echo "ERRO:"
            echo "Resultado completo não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/b3_investment_engine_eligible.csv" ]; then
            echo "ERRO:"
            echo "Arquivo de elegíveis não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/run_summary.json" ]; then
            echo "ERRO:"
            echo "run_summary.json não encontrado."
            exit 1
          fi

          echo ""
          echo "Resumo:"
          cat final_report/run_summary.json

          echo ""
          echo "Resultado do motor: OK"


      # ======================================================
      # 24. GERAR RELATÓRIO FINAL
      # ======================================================

      - name: Generate final report
        run: |
          python report_generator.py


      # ======================================================
      # 25. MOSTRAR ARQUIVOS GERADOS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ -d "data/live/cvm" ]; then
            echo ""
            echo "CVM:"
            find data/live/cvm \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "data/live/b3" ]; then
            echo ""
            echo "B3:"
            find data/live/b3 \
              -maxdepth 4 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "data/live/fundamental" ]; then
            echo ""
            echo "FUNDAMENTAL LIVE:"
            find data/live/fundamental \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "final_report" ]; then
            echo ""
            echo "FINAL REPORT:"
            find final_report \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "checkpoints" ]; then
            echo ""
            echo "CHECKPOINTS:"
            find checkpoints \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "logs" ]; then
            echo ""
            echo "LOGS:"
            find logs \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi


      # ======================================================
      # 26. UPLOAD RELATÓRIO
      # ======================================================

      - name: Upload final report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_REPORT
          path: |
            final_report/
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 27. UPLOAD MANIFESTOS
      # ======================================================

      - name: Upload LIVE manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_LIVE_MANIFESTS
          path: |
            data/live/cvm/cvm_manifest.json
            data/live/b3/*.json
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 28. UPLOAD CHECKPOINTS
      # ======================================================

      - name: Upload checkpoints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_CHECKPOINTS
          path: |
            checkpoints/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 29. UPLOAD LOGS EM FALHA
      # ======================================================

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_FAILURE_LOGS
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 30
