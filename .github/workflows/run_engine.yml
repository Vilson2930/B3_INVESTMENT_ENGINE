name: Run B3 Investment Engine

on:
  schedule:
    - cron: "30 22 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-engine:

    name: B3 Investment Engine
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. INFORMAÇÕES DO AMBIENTE
      # ======================================================

      - name: Environment information
        run: |
          echo "=========================================="
          echo "B3_INVESTMENT_ENGINE"
          echo "=========================================="
          python --version
          pip --version
          echo "UTC:"
          date -u
          echo "=========================================="


      # ======================================================
      # 5. VALIDAR CONFIGURAÇÃO
      # ======================================================

      - name: Validate configuration
        run: |
          python config.py


      # ======================================================
      # 6. TESTAR MOTORES CONGELADOS
      # ======================================================

      - name: Test Fundamental Engine
        run: |
          python fundamental_engine.py

      - name: Test Technical Timing Engine
        run: |
          python technical_engine.py

      - name: Test Integration Engine
        run: |
          python integration_engine.py


      # ======================================================
      # 7. RESTAURAR CACHE PERSISTENTE B3
      # ======================================================
      #
      # Preserva entre runners:
      #
      # 1. COTAHIST histórico oficial;
      # 2. SPRE do ano corrente;
      # 3. snapshots incrementais processados.
      #
      # O cache NÃO congela os dados.
      #
      # Os scripts de atualização continuam sendo executados
      # em toda rodada e verificam novos dados oficiais.
      # ======================================================

      - name: Restore B3 persistent cache
        id: b3-cache
        uses: actions/cache@v4
        with:
          path: |
            data/live/b3/cotahist
            data/live/b3/current_year
            data/live/b3/cache
          key: b3-live-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            b3-live-${{ runner.os }}-


      # ======================================================
      # 8. AUDITAR CACHE RESTAURADO
      # ======================================================

      - name: Audit restored B3 cache
        run: |
          echo "=========================================="
          echo "CACHE B3 RESTAURADO"
          echo "=========================================="

          echo "Cache hit exato:"
          echo "${{ steps.b3-cache.outputs.cache-hit }}"

          echo ""
          echo "COTAHIST:"
          if [ -d "data/live/b3/cotahist" ]; then
            find data/live/b3/cotahist \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
          else
            echo "Nenhum COTAHIST restaurado."
          fi

          echo ""
          echo "SPRE ANO CORRENTE:"
          if [ -d "data/live/b3/current_year" ]; then
            COUNT=$(find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              -name 'SPRE*.zip' \
              | wc -l)

            echo "Arquivos SPRE restaurados: $COUNT"

            find data/live/b3/current_year \
              -maxdepth 1 \
              -type f \
              -name 'SPRE*.zip' \
              -print \
              | sort \
              | tail -10
          else
            echo "Nenhum SPRE restaurado."
          fi

          echo ""
          echo "SNAPSHOTS/CACHE:"
          if [ -d "data/live/b3/cache" ]; then
            find data/live/b3/cache \
              -maxdepth 3 \
              -type f \
              -print \
              | sort
          else
            echo "Nenhum snapshot restaurado."
          fi

          echo "=========================================="


      # ======================================================
      # 9. ATUALIZAR DADOS OFICIAIS CVM
      # ======================================================

      - name: Update official CVM data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO OFICIAL CVM"
          echo "=========================================="

          python update_cvm_data.py

          echo "=========================================="
          echo "DADOS CVM ATUALIZADOS"
          echo "=========================================="


      # ======================================================
      # 10. AUDITAR CAMADA CVM
      # ======================================================

      - name: Audit updated CVM data
        run: |
          echo "=========================================="
          echo "AUDITORIA DA CAMADA CVM"
          echo "=========================================="

          if [ ! -f "data/live/cvm/cad_cia_aberta.csv" ]; then
            echo "ERRO:"
            echo "Cadastro CVM atualizado não encontrado."
            exit 1
          fi

          if [ ! -f "data/live/cvm/cvm_manifest.json" ]; then
            echo "ERRO:"
            echo "Manifesto CVM não encontrado."
            exit 1
          fi

          echo "Cadastro CVM: OK"
          echo "Manifesto CVM: OK"

          echo ""
          echo "Arquivos DFP:"
          find data/live/cvm/dfp \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo ""
          echo "Arquivos ITR:"
          find data/live/cvm/itr \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo ""
          echo "Manifesto:"
          cat data/live/cvm/cvm_manifest.json

          echo ""
          echo "=========================================="
          echo "CAMADA CVM VALIDADA"
          echo "=========================================="


      # ======================================================
      # 11. ATUALIZAR HISTÓRICO OFICIAL B3
      # ======================================================
      #
      # Executa sempre.
      #
      # Histórico existente e válido é reutilizado.
      # Arquivo ausente/inválido é recuperado.
      # ======================================================

      - name: Update official B3 historical data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO HISTÓRICA B3"
          echo "=========================================="

          python update_b3_data.py

          echo "=========================================="
          echo "HISTÓRICO B3 ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 12. ATUALIZAR ANO CORRENTE B3
      # ======================================================
      #
      # update_b3_current_year.py V2 incremental.
      #
      # Primeira carga:
      # bootstrap do ano.
      #
      # Execuções seguintes:
      # verifica apenas a janela necessária para encontrar
      # pregões novos/atrasados.
      # ======================================================

      - name: Update current-year B3 data
        run: |
          echo "=========================================="
          echo "ATUALIZAÇÃO B3 — ANO CORRENTE"
          echo "=========================================="

          python update_b3_current_year.py

          echo "=========================================="
          echo "B3 ANO CORRENTE ATUALIZADO"
          echo "=========================================="


      # ======================================================
      # 13. CONSTRUIR MARKET HISTORY LIVE
      # ======================================================
      #
      # build_b3_market_history.py V4:
      #
      # - snapshot persistente;
      # - COTAHIST já incorporado não é reprocessado;
      # - SPRE já incorporado não é reprocessado;
      # - novo pregão é incorporado;
      # - checkpoint após cada fonte processada.
      # ======================================================

      - name: Build B3 market history LIVE
        run: |
          echo "=========================================="
          echo "BUILD B3 MARKET HISTORY LIVE"
          echo "=========================================="

          python build_b3_market_history.py

          if [ ! -f "data/live/b3/market_history_live.csv" ]; then
            echo "ERRO:"
            echo "market_history_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/spre_prices_live.csv" ]; then
            echo "ERRO:"
            echo "spre_prices_live.csv não foi criado."
            exit 1
          fi

          if [ ! -f "data/live/b3/market_history_manifest.json" ]; then
            echo "ERRO:"
            echo "market_history_manifest.json não foi criado."
            exit 1
          fi

          echo ""
          echo "market_history_live.csv: OK"
          echo "spre_prices_live.csv: OK"
          echo "market_history_manifest.json: OK"

          echo ""
          echo "Manifesto:"
          cat data/live/b3/market_history_manifest.json


      # ======================================================
      # 14. CONSTRUIR FUNDAMENTOS LIVE
      # ======================================================

      - name: Build LIVE fundamental input
        run: |
          echo "=========================================="
          echo "BUILD FUNDAMENTAL INPUT LIVE"
          echo "=========================================="

          python build_live_fundamental_input.py

          echo "=========================================="
          echo "FUNDAMENTOS LIVE CONSTRUÍDOS"
          echo "=========================================="


      # ======================================================
      # 15. AUDITAR FUNDAMENTOS LIVE
      # ======================================================

      - name: Audit LIVE fundamental input
        run: |
          echo "=========================================="
          echo "AUDITORIA FUNDAMENTAL LIVE"
          echo "=========================================="

          FILE="data/live/fundamental/fundamental_input_live.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/live/fundamental/"
              "fundamental_input_live.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "TICKER",
              "QUALITY_SCORE",
              "HISTORY_YEARS",
              "AVG_DAILY_LIQUIDITY_BRL",
              "VALUATION_SCORE",
              "FUNDAMENTAL_SCORE",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "ERRO: colunas ausentes no "
                  f"fundamental LIVE: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: fundamental_input_live.csv vazio."
              )

          tickers = (
              df["TICKER"]
              .astype(str)
              .str.strip()
              .str.upper()
          )

          if tickers.duplicated().any():
              raise SystemExit(
                  "ERRO: tickers duplicados no "
                  "fundamental_input_live.csv."
              )

          quality = pd.to_numeric(
              df["QUALITY_SCORE"],
              errors="coerce",
          )

          print(
              "Empresas:",
              len(df),
          )

          print(
              "Tickers únicos:",
              tickers.nunique(),
          )

          print(
              "Quality Score >= 60:",
              int(
                  (quality >= 60).sum()
              ),
          )

          print(
              "Fundamental LIVE: OK"
          )
          PY


      # ======================================================
      # 16. VALIDAR BASE TÉCNICA ATUAL
      # ======================================================
      #
      # TRANSITÓRIO:
      #
      # A camada fundamental já está LIVE.
      #
      # A camada técnica ainda utiliza:
      # data/technical_prices.csv
      #
      # Não declarar o robô 100% LIVE antes da substituição
      # desta camada.
      # ======================================================

      - name: Validate current technical input
        run: |
          echo "=========================================="
          echo "AUDITORIA TÉCNICA ATUAL"
          echo "=========================================="

          FILE="data/technical_prices.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERRO:"
            echo "$FILE não encontrado."
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/technical_prices.csv"
          )

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          df.columns = [
              str(c).strip().upper()
              for c in df.columns
          ]

          required = [
              "CD_CVM",
              "TICKER",
              "DATE",
              "TECH_SEGMENT_ID",
              "OPEN",
              "HIGH",
              "LOW",
              "CLOSE",
              "SMA200_SLOPE_20D",
              "ATR_PCT",
              "ROC_60",
              "MACD_HIST_PCT",
              "DIST_SMA_200",
              "BB_WIDTH",
              "DIST_SMA_50",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "ERRO: colunas técnicas ausentes: "
                  f"{missing}"
              )

          if df.empty:
              raise SystemExit(
                  "ERRO: technical_prices.csv vazio."
              )

          print(
              "Registros técnicos:",
              len(df),
          )

          print(
              "Tickers:",
              df["TICKER"].nunique(),
          )

          print(
              "Technical Score: NÃO"
          )

          print(
              "Base técnica atual: OK"
          )
          PY


      # ======================================================
      # 17. VERIFICAR ENTRADAS DO MAIN
      # ======================================================

      - name: Check engine input data
        run: |
          echo "=========================================="
          echo "ENTRADAS DO MAIN.PY"
          echo "=========================================="

          FUNDAMENTAL="data/live/fundamental/fundamental_input_live.csv"
          TECHNICAL="data/technical_prices.csv"

          if [ ! -f "$FUNDAMENTAL" ]; then
            echo "ERRO:"
            echo "$FUNDAMENTAL não encontrado."
            exit 1
          fi

          if [ ! -f "$TECHNICAL" ]; then
            echo "ERRO:"
            echo "$TECHNICAL não encontrado."
            exit 1
          fi

          echo "Fundamental LIVE: OK"
          echo "Técnico atual: OK"

          echo ""
          ls -lh "$FUNDAMENTAL"
          ls -lh "$TECHNICAL"


      # ======================================================
      # 18. EXECUTAR MOTOR
      # ======================================================

      - name: Run B3 Investment Engine
        run: |
          echo "=========================================="
          echo "EXECUTANDO B3 INVESTMENT ENGINE"
          echo "=========================================="

          python main.py


      # ======================================================
      # 19. VALIDAR RESULTADO
      # ======================================================

      - name: Validate engine results
        run: |
          echo "=========================================="
          echo "VALIDAÇÃO DO RESULTADO"
          echo "=========================================="

          if [ ! -f "final_report/b3_investment_engine_results.csv" ]; then
            echo "ERRO:"
            echo "Resultado completo não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/b3_investment_engine_eligible.csv" ]; then
            echo "ERRO:"
            echo "Arquivo de elegíveis não encontrado."
            exit 1
          fi

          if [ ! -f "final_report/run_summary.json" ]; then
            echo "ERRO:"
            echo "run_summary.json não encontrado."
            exit 1
          fi

          echo ""
          echo "Resumo:"
          cat final_report/run_summary.json

          echo ""
          echo "Resultado do motor: OK"


      # ======================================================
      # 20. GERAR RELATÓRIO FINAL
      # ======================================================

      - name: Generate final report
        run: |
          python report_generator.py


      # ======================================================
      # 21. MOSTRAR ARQUIVOS GERADOS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ -d "data/live/cvm" ]; then
            echo ""
            echo "CVM:"
            find data/live/cvm \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "data/live/b3" ]; then
            echo ""
            echo "B3:"
            find data/live/b3 \
              -maxdepth 3 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "data/live/fundamental" ]; then
            echo ""
            echo "FUNDAMENTAL LIVE:"
            find data/live/fundamental \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "final_report" ]; then
            echo ""
            echo "FINAL REPORT:"
            find final_report \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "checkpoints" ]; then
            echo ""
            echo "CHECKPOINTS:"
            find checkpoints \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

          if [ -d "logs" ]; then
            echo ""
            echo "LOGS:"
            find logs \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi


      # ======================================================
      # 22. SALVAR RELATÓRIO FINAL
      # ======================================================

      - name: Upload final report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_REPORT
          path: |
            final_report/
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 23. SALVAR MANIFESTOS LIVE
      # ======================================================

      - name: Upload LIVE manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_LIVE_MANIFESTS
          path: |
            data/live/cvm/cvm_manifest.json
            data/live/b3/*.json
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 24. SALVAR CHECKPOINTS
      # ======================================================

      - name: Upload checkpoints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_CHECKPOINTS
          path: |
            checkpoints/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================
      # 25. SALVAR LOGS SE HOUVER FALHA
      # ======================================================

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: B3_INVESTMENT_ENGINE_FAILURE_LOGS
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 30
